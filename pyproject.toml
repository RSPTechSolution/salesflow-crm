[project]
name = "salesflow-crm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", #Pycodestyle Errors
    "F", #Pyflakes
    "I", #isort
    "UP", #pyupgrade
]
ignore = ["E501"]
